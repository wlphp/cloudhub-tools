[package]
name = "tauri-plugin-cloudhub-keystore"
version = "0.1.0"
authors = [ "CloudHub" ]
description = "Android Keystore and iOS Keychain access for CloudHub Tools"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-cloudhub-keystore"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.22"
serde_json = "1"
zeroize = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
