[package]
name = "cloudhub-tools"
version = "0.1.95"
description = "本地阿里云资源管理客户端"
authors = ["wanglei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cloudhub_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
rcgen = "0.13"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-cloudhub-keystore = { path = "plugins/cloudhub-keystore" }
tauri-plugin-cloudhub-mobile-updater = { path = "plugins/cloudhub-mobile-updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "=0.20.2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
rand = "0.8"
dirs = "5"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
zeroize = "1"
argon2 = "0.5"
dryoc = "0.7"
data-encoding = "2"
hex = "0.4"
percent-encoding = "2"
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
x509-parser = { version = "0.18", features = ["verify"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rqrr = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-updater = "2.10.1"
arboard = { version = "3", default-features = false }

# Chrome for Testing encrypts stored cookie values with DPAPI-protected AES-GCM
# keys. Reading them offline requires only CryptUnprotectData. The desktop
# client also needs window activation so an already running single instance can
# be brought to the front instead of silently handing over to a dead process.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.1"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
