      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2588f5"/>
      <stop offset="0.32" stop-color="#19bddd"/>
      <stop offset="0.52" stop-color="#54c3c1"/>
      <stop offset="0.72" stop-color="#f6b338"/>
