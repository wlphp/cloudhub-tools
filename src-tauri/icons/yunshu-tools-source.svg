  <rect x="72" y="72" width="880" height="880" rx="164" fill="url(#tile)"/>
  <circle cx="512" cy="512" r="300" fill="#fff" opacity="0.72"/>

  <!-- One continuous, bilaterally symmetric cloud outline. -->
