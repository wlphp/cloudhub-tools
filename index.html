<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云枢 Tools · 本地多云资源管理</title>
    <style>
      :root { color-scheme: dark; }
      html, body { min-height: 100%; margin: 0; background: #1f1f1f !important; color: #d4d4d4; }
      #root { min-height: 100%; }
      #app-bootstrap { position: fixed; inset: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: 32px minmax(0, 1fr); overflow: hidden; background: #1f1f1f; color: #b9b9b9; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #app-bootstrap::before { content: "云枢 Tools   本地多云资源管理"; display: flex; align-items: center; grid-column: 1 / -1; padding: 0 14px; border-bottom: 1px solid #373737; background: #2b2b2b; color: #d4d4d4; font-size: 11px; }
      .boot-sidebar { grid-row: 2; border-right: 1px solid #3b3b3b; background: #252526; }
      .boot-sidebar::before { content: "云枢 Tools\A 本地多云资源管家"; display: block; padding: 26px 22px; color: #d7d7d7; white-space: pre-line; line-height: 1.8; font-weight: 600; }
      .boot-main { display: grid; align-content: start; gap: 14px; padding: 58px 48px; background: #1f1f1f; }
      .boot-title, .boot-line, .boot-table { border-radius: 3px; background: #303030; animation: boot-pulse 1.25s ease-in-out infinite alternate; }
      .boot-title { width: 190px; height: 24px; }
      .boot-line { width: 360px; max-width: 55%; height: 12px; opacity: .75; }
      .boot-table { width: min(900px, 100%); height: 220px; margin-top: 12px; border: 1px solid #3b3b3b; background: #242424; border-top: 1px solid #3d3d3d; }
      @keyframes boot-pulse { from { opacity: .55; } to { opacity: .95; } }
      @media (max-width: 720px) { #app-bootstrap { grid-template-columns: 1fr; } .boot-sidebar { display: none; } .boot-main { padding: 58px 20px; } }
      @media (prefers-reduced-motion: reduce) { .boot-title, .boot-line, .boot-table { animation: none; } }
    </style>
  </head>

  <body>
    <div id="app-bootstrap" aria-label="云枢 Tools 正在启动"><div class="boot-sidebar"></div><div class="boot-main"><div class="boot-title"></div><div class="boot-line"></div><div class="boot-table"></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
