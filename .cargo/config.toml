[env]
# whisper.cpp's ggml backend otherwise compiles for the CI host CPU, which can
# emit AVX-512 instructions that are unavailable on supported Windows PCs.
GGML_NATIVE = { value = "OFF", force = true }
# 标量编译下 ggml 推理 1.5 秒音频要 30 秒。显式开启 Haswell(2013+) 基线的
# SSE42/AVX2/FMA 后回到 1-3 秒；仍不包含 AVX-512，与上面可移植性约束一致。
GGML_SSE42 = { value = "ON", force = true }
GGML_AVX2 = { value = "ON", force = true }
GGML_FMA = { value = "ON", force = true }
