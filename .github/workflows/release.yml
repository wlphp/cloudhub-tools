name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish from main
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - name: macOS Intel
            platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts."
            exit 1
          fi

      - name: Run shared pre-release checks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx playwright install chromium
          npm run verify:release-config
          npm run build
          npm run verify:platform-contracts
          npm run verify:rust-boundary
          npm run verify:resource-contracts
          node scripts/verify-web-api-security.mjs
          node scripts/verify-web-api-logs.mjs
          node scripts/verify-web-api-ai.mjs
          npm run test:ui
          node scripts/verify-format-panel.mjs
          node scripts/verify-resources-pure.mjs
          node --check web-api.mjs

      - name: Check and test Rust on each desktop platform
        shell: bash
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: CloudHub Tools ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## 更新内容

            - 改进 Codex 供应商导入、模型目录及探测错误提示。
            - 改进面板入口地址处理，支持连接验证失败后确认保存。
            - 优化界面布局、面板指标和错误信息展示。
            - 精简发布平台与重复检查，统一 Windows、macOS、Android 和 iOS 版本。

            ## 下载说明

            提供 Windows、macOS 桌面版本，以及 Android 和 iOS 手机端产物。
            macOS 下载包按处理器区分：Apple Silicon（M 系列）和 Intel。
            Android ARM64 APK 使用现有本机测试证书签名，供直接安装使用。
            iOS 提供未签名 Xcode 归档，需要在 Mac 上配置 Apple 签名后安装，不能直接作为 IPA 安装。
          releaseDraft: false
          prerelease: false
          retryAttempts: 5
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      - name: Audit Windows bundle artifacts
        if: runner.os == 'Windows'
        run: npm run verify:bundle-artifacts -- --platform windows
