name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - name: macOS Intel
            platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Linux x64
            platform: ubuntu-24.04
            args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts."
            exit 1
          fi

      - name: Run pre-release checks
        shell: bash
        run: |
          npx playwright install chromium
          npm run verify:release-config
          npm run build
          npm run verify:platform-contracts
          npm run verify:rust-boundary
          node scripts/verify-web-api-security.mjs
          node scripts/verify-web-api-logs.mjs
          npm run test:ui
          node scripts/verify-format-panel.mjs
          node scripts/verify-resources-pure.mjs
          node --check web-api.mjs
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CloudHub Tools ${{ github.ref_name }}
          releaseBody: |
            ## 更新内容

            - 优化客户端更新流程与启动体验。
            - 修复已知问题，提升程序稳定性。

            ## 下载说明

            提供 Windows、macOS 和 Linux 桌面版本。
            macOS 下载包按处理器区分：Apple Silicon（M 系列）和 Intel。
          releaseDraft: false
          prerelease: false
          retryAttempts: 5
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      - name: Audit Windows bundle artifacts
        if: runner.os == 'Windows'
        run: npm run verify:bundle-artifacts -- --platform windows
