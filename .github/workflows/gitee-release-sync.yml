name: Sync GitHub Release assets to Gitee

on:
  release:
    types: [published, edited]
  workflow_run:
    workflows:
      - Release desktop apps
      - Release mobile apps
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-release-sync-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="$INPUT_TAG"
          if [ "$EVENT_NAME" = "release" ]; then tag="$EVENT_TAG"; fi
          if [ "$EVENT_NAME" = "workflow_run" ]; then tag="$WORKFLOW_TAG"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][[:alnum:]._-]+)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir release-assets
      - name: Mirror attachments to Gitee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/sync-gitee-release.mjs "$RELEASE_TAG" release-assets
